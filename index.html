<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PREPASCORE - AI Exam Evaluator for Indian Students</title>
    <meta name="description" content="A strict, exam-focused evaluation assistant for Indian students covering MCQs, Short/Long answers, and syllabus tracking." />
    <meta property="og:title" content="PREPASCORE - AI Exam Evaluator for Indian Students" />
    <meta property="og:description" content="A strict, exam-focused evaluation assistant for Indian students covering MCQs, Short/Long answers, and syllabus tracking." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Polyfill for process.env to prevent "process is not defined" crashes in browser
      window.process = window.process || { env: {} };
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Momentum Scroll & Smoothness */
      html {
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
      }

      /* Global Button Interaction Rules */
      button {
        transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s, box-shadow 0.2s, opacity 0.2s;
        cursor: pointer;
      }
      button:active:not(:disabled) {
        transform: scale(0.98);
      }

      /* Keyframes */
      @keyframes fadeScaleIn {
        0% { opacity: 0; transform: scale(0.96); }
        100% { opacity: 1; transform: scale(1); }
      }

      @keyframes fadeInUp {
        0% { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes subtleFloat {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
      }

      /* Animation Utility Classes */
      .animate-fade-scale {
        animation: fadeScaleIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      .animate-page-enter {
        animation: fadeInUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      .animate-card {
        opacity: 0; /* Start hidden */
        animation: fadeInUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      .animate-float {
        animation: subtleFloat 6s ease-in-out infinite;
      }

      /* Stagger Delays */
      .delay-75 { animation-delay: 75ms; }
      .delay-100 { animation-delay: 100ms; }
      .delay-150 { animation-delay: 150ms; }
      .delay-200 { animation-delay: 200ms; }
      .delay-300 { animation-delay: 300ms; }

      /* Premium Gradients */
      .bg-soft-gradient {
        background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
